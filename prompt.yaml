id: qwen_prompts
version: "1.0"
language: en
description: >
  Centralized prompt configuration for RAG evaluation and benchmarking.
  Includes system role, generic user prompts, and few-shot examples.

# ==============================
#  System Prompt
# ==============================
system_prompt:
    role: system
    content: |
        You are a general expert in various fields, capable of answering questions based on provided contexts.
        Your task is to answer the questions with help of the given contexts and metadata. 
        If the question requires reasoning, you should think step by step and show your reasoning steps explicitly within <think>...</think> tags before giving the final answer.
        If there is no supporting evidence in contexts to support your answer, use the knowledge that you already knew before.
        Your answer must be as concise as possible, never return a generic summary.
        Output the final answer in the format: "Answer: <your answer>".

# ==============================
#  User Prompt Templates
# ==============================
user_prompts:
  name: rag_prompt
  description: Standard RAG query template
  template: |
    Here are the relevant contexts and metadata:
    {contexts_block}
    Question:
    {query}
    Here is a description of the question:
    {instruction}

# ==============================
#  Few-shot Examples
# ==============================
fewshots:
  hot_qa:
    description: Few-shot examples for HotpotQA benchmark
    examples:
      content: |
        ### Example (HotPotQA)
        Question: "Which two actors starred in both 'Ocean's Eleven' and 'Ocean's Twelve'?"
        Contexts:
        [Context 1] George Clooney starred in 'Ocean's Eleven' and 'Ocean's Twelve'.
        [Context 2] Brad Pitt starred in 'Ocean's Eleven' and 'Ocean's Twelve'.
        <think>
        Step 1 - Identify relevant contexts: Context 1 and Context 2 mention actors in both movies.
        Step 2 - Connect facts: George Clooney and Brad Pitt appear in both.
        </think>
        Answer: <George Clooney and Brad Pitt>
    instruction:
      template: |
        [Task Instruction: HotPotQA]
        - Multi-hop reasoning required.
        - Use evidence from at least two different contexts.
        - Show explicit reasoning steps connecting facts before the final answer.
        - Even if 10 or more contexts are given, you must still return a **direct answer to the question**, never a generic summary.

  squad:
    description: Few-shot examples for SQuAD benchmark
    examples:
      content: |
        ### Example_1
        Question: "When was the Eiffel Tower completed?"
        Contexts:
        [Context 1] Construction of the Eiffel Tower started in 1887 and finished in 1889.
        Answer: <1889>

        ### Example_2
        Question: "Who wrote '1984'?"
        Contexts:
        [Context 1] George Orwell authored the novel '1984'.
        Answer: <George Orwell>              
    instruction:
      template: |
        [Task Instruction: SQuAD]
        - The answer is usually a short span of text that directly addresses the question.
        - Do not provide extra explanation, only the exact factual answer.
        - Even if 10 or more contexts are given, you must still return a **direct answer to the question**, never a generic summary.

  natural_questions:
    description: Few-shot examples for natural questions benchmark
    examples:
      content: |
        ### Example_1
        Question: "When was the Eiffel Tower completed?"
        Contexts:
        [Context 1] Construction of the Eiffel Tower started in 1887 and finished in 1889.
        Answer: <1889>

        ### Example_2
        Question: "Who wrote '1984'?"
        Contexts:
        [Context 1] George Orwell authored the novel '1984'.
        Answer: <George Orwell>
    instruction:
      template: |
        [Task Instruction: Natural Questions]
        - These questions are open-domain, often requiring Wikipedia-style factual answers.
        - Ensure conciseness and focus only on the central fact.
        - If the question is ambiguous, clarify the scope explicitly before answering.

  web_questions:
    description: Few-shot examples for web questions benchmark
    examples:
      content: |
        ### Example_1
        Question: "When was the Eiffel Tower completed?"
        Contexts:
        [Context 1] Construction of the Eiffel Tower started in 1887 and finished in 1889.
        Answer: <1889>

        ### Example_2
        Question: "Who wrote '1984'?"
        Contexts:
        [Context 1] George Orwell authored the novel '1984'.
        Answer: <George Orwell>
    instruction:
      template: |
        [Task Instruction: WebQuestions]
        - WebQuestions are designed for Freebase-style QA.
        - Prioritize entity linking: map question entities to the most likely canonical entity.
        - Answer should be concise and entity-focused.
        - Even if 10 or more contexts are given, you must still return a **direct answer to the question**, never a generic summary.

  mmlu:
    description: Few-shot examples for mmlu benchmark
    examples:
      content: |
        ### Example (MMLU)
        Question: "What is the derivative of sin(x)?"
        Options: 0) cos(x) 1) sin(x) 2) -cos(x) 3) -sin(x)
        [Context 1] calculus rule: d/dx[sin(x)] = cos(x).
        [Context 2] definition of derivative: the derivative of a function at a point is the slope of the tangent line to the function at that point.
        <think>
        Step 1 - Apply calculus rule: d/dx[sin(x)] = cos(x).
        Step 2 - Check options: Option 1 matches result.
        </think>
        Answer: <0>      
    instruction:
      template: |
        [Task Instruction: MMLU]
        - This dataset contains multiple-choice questions across many academic fields.
        - Show reasoning, then select the best option explicitly as the final answer.
        - Even if 10 or more contexts are given, you must still return a **direct answer to the question**, never a generic summary.\
        - Do not explain your answer or include any additional text. Just reply with: 0, 1, 2, or 3.
        Choices:
        {options}
        Which one is correct?

  strategy_qa:
    description: Few-shot examples for strategy benchmark
    examples:
      content: |
        ### Example (StrategyQA)
        Question: "Can a human survive in outer space without a suit?"
        Contexts:
        [Context 1] Humans need oxygen to breathe and survive.
        [Context 2] outer space is a vacuum with extreme temperatures.
        <think>
        Step 1 - Context 1 metioned humans need oxygen.
        Step 2 - Context 2 indicated outer space is a vacuum without breathable air.
        Step 3 - Conclusion: Survival is impossible.
        </think>
        Answer: <False>      
    instruction:
      template: |
        [Task Instruction: StrategyQA]
        - These are True/False questions requiring multi-hop reasoning.
        - Always provide reasoning chain explicitly.
        - Even if 10 or more contexts are given, you must still return a **direct answer to the question**, never a generic summary.
        - Do not provide any explanation or extra words. Only reply with: True or False  

  trivia_qa:
    description: Few-shot examples for trivia_qa benchmark
    examples:
      content: |
        ### Example_1
        Question: "When was the Eiffel Tower completed?"
        Contexts:
        [Context 1] Construction of the Eiffel Tower started in 1887 and finished in 1889.
        Answer: <1889>

        ### Example_2
        Question: "Who wrote '1984'?"
        Contexts:
        [Context 1] George Orwell authored the novel '1984'.
        Answer: <George Orwell>             
    instruction:
      template: |
        [Task Instruction: TriviaQA]
        - These are trivia-style questions; answers are usually short entities (names, dates, places).
        - Focus on providing the *most specific single correct entity*.
        - Even if 10 or more contexts are given, you must still return a **direct answer to the question**, never a generic summary.

  general:
    description: General Few-shot
    examples:
      content: |
        ### General Example
        Question: "Did Francois Mitterrand ever meet Barack Obama while they both held the position of President?"
        Contexts:
        [Context 1] Sandro Pertini, Italian president... Franklin D. Roosevelt (1882–1945), 32nd President of the United States... Joseph Stalin (1878–1953), Premier of the USSR...
        [Context 2] In 2007, Downey conducted a forum... Senators Joe Biden, Hillary Clinton, Obama...
        [Context 3] April 23, 1964... Tanganyikan President Julius Nyerere...
        [Context 4] U.S. President Barack Obama commented on fake news in 2016...
        [Context 5] Milton R. Wolf... is President Barack Obama's second cousin...

        <think>     
        Step 1 - Rephrase: The question asks if Mitterrand and Obama were both presidents at the same time and met during that overlap.  
        Step 2 - Keywords: "Francois Mitterrand", "Barack Obama", "both presidents", "met".  
        Step 3 - Timeline check:
           - Mitterrand was President of France from 1981 to 1995.
           - Obama was President of the U.S. from 2009 to 2017.
           - Their terms did not overlap.
        Step 4 - Context check:
           - Context 1: Mentions many presidents, but not Mitterrand-Obama meeting. (Irrelevant)
           - Context 2: Obama appears in 2007 as a candidate, Mitterrand already out of office. (Irrelevant)
           - Context 3: Event in 1964, unrelated. (Irrelevant)
           - Context 4: Obama in 2016, Mitterrand long gone. (Irrelevant)
           - Context 5: Obama's cousin, no link to Mitterrand. (Irrelevant)
        Step 5 - Conclusion: No evidence of a meeting while both were presidents; historically impossible due to non-overlapping terms.
        </think>
        Answer: False